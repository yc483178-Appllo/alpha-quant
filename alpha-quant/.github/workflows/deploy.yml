name: Deploy to Alibaba Cloud

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 部署到阿里云
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 打印部署信息
        run: |
          echo "=========================================="
          echo "🚀 Alpha Quant 部署开始"
          echo "=========================================="

      - name: 🔐 配置 SSH 密钥
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: 📥 测试 SSH 连接
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALPACA_HOST }}
          username: ${{ secrets.ALPACA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30
          script: |
            echo "✅ SSH 连接成功!"
            whoami
            pwd
            ls -la /home/admin/ 2>/dev/null || echo "No /home/admin"

      - name: 📤 部署完成
        run: |
          echo "=========================================="
          echo "🎉 部署测试成功!"
          echo "=========================================="
