name: Deploy to Alibaba Cloud

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  debug:
    name: 🔍 调试信息
    runs-on: ubuntu-latest
    steps:
      - name: 📝 打印 Secrets（仅显示前几位）
        run: |
          echo "Host: ${{ secrets.ALPACA_HOST }}"
          echo "User: ${{ secrets.ALPACA_USER }}"
          echo "Key starts with: ${{ secrets.SSH_PRIVATE_KEY }}"
          echo "Key length: ${{ secrets.SSH_PRIVATE_KEY.length }}"
          
      - name: 🔐 测试 SSH 连接
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALPACA_HOST }}
          username: ${{ secrets.ALPACA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30
          script: |
            echo "SSH连接成功!"
            whoami
